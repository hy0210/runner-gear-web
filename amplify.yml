# AWS Amplify Hosting 的建置設定（main 有新的合併時自動建置部署）
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - node --version
        - npm ci
    build:
      commands:
        # VITE_API_BASE_URL 在 Amplify 主控台的 Environment variables 設定；缺少時建置會失敗
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
