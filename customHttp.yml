# AWS Amplify Hosting 的回應標頭。放在 Repo 根目錄，會覆寫主控台 Custom headers 的設定。
# connect-src 必須包含後端的網址；後端網址變更時要一起修改。
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self' https://d1461t9n4hr1h9.cloudfront.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
